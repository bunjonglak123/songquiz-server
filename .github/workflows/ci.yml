name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, staticcheck, test -race
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t songquiz-server .

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No env files tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env[^/]*|[^/]*\.env)$'; then
            echo "::error::env file is tracked by git"; exit 1
          fi
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
